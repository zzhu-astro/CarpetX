name: CI

# Control when the workflow will run
on:
  push:
  pull_request:
  # Allow running this workflow manually from the Actions tab (browser) or via
  # `gh workflow run`. The VisIt plane-output verification is slow (installs
  # VisIt, ~40 min) and only runs on a manual dispatch — never on push/PR.
  workflow_dispatch:
    inputs:
      run_visit:
        description: 'Run the VisIt plane-output verification (slow: installs VisIt, ~40 min)'
        type: boolean
        default: true

# concurrency:
#   group: carpetx
#   cancel-in-progress: false

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job
  download-build-test:
    strategy:
      matrix:
        accelerator: [cpu, cuda, rocm]
        real-precision: [real32, real64]
        mode: [debug, optimize]
        exclude:
          - {accelerator: rocm, real-precision: real32}
          - {accelerator: oneapi, real-precision: real32}
          - {accelerator: oneapi, mode: debug} # uses too much disk space?
          - {accelerator: rocm, mode: debug} # uses too much memory?
          - {real-precision: real32, mode: optimize}
    env:
      ACCELERATOR: ${{matrix.accelerator}}
      REAL_PRECISION: ${{matrix.real-precision}}
      MODE: ${{matrix.mode}}
      # True only on a manual dispatch with the run_visit input left on; always
      # false for push/PR (inputs is null there, so the expression short-circuits).
      RUN_VISIT: ${{github.event_name == 'workflow_dispatch' && inputs.run_visit}}
      # ccache: the actions-*.cfg optionlists wrap CC/CXX with `ccache`, so the
      # object cache is restored across runs (see the Restore ccache step). Keep
      # the dir inside the workspace so actions/cache can reach it; compare by
      # file content since the container's compiler mtimes are not stable.
      CCACHE_DIR: ${{github.workspace}}/.ccache
      CCACHE_MAXSIZE: "2G"
      CCACHE_COMPILERCHECK: content

    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    container: lwji/carpetx:${{matrix.accelerator}}-${{matrix.real-precision}}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Check out the repository under $GITHUB_WORKSPACE, so our job can access it
      - uses: actions/checkout@v4

      - name: Log the triggering commit
        run: echo ${{github.event.client_payload.trigger}}

      - name: Download Cactus
        run: /bin/bash $GITHUB_WORKSPACE/scripts/download.sh

      - name: Install ccache
        # ccache is not baked into the carpetx container images, but the
        # optionlists invoke CC/CXX through it, so it must be on PATH. Install
        # is cheap and idempotent; -z zeroes the per-run counters so the stats
        # step below reports this run's hit rate.
        run: |
          if ! command -v ccache >/dev/null 2>&1; then
            apt-get update -qq \
              && apt-get install -y -qq --no-install-recommends ccache \
              || echo "::warning::could not install ccache; the build will fail if CC/CXX cannot find it"
          fi
          ccache --version
          ccache -z

      - name: Restore ccache
        # Keyed per matrix cell (objects differ by compiler/precision/mode) and
        # per commit; restore-keys falls back to the newest cache for this cell.
        uses: actions/cache@v4
        with:
          path: ${{env.CCACHE_DIR}}
          key: ccache-${{matrix.accelerator}}-${{matrix.real-precision}}-${{matrix.mode}}-${{github.sha}}
          restore-keys: |
            ccache-${{matrix.accelerator}}-${{matrix.real-precision}}-${{matrix.mode}}-

      - name: Build Cactus
        run: /bin/bash $GITHUB_WORKSPACE/scripts/build.sh

      - name: Show ccache stats
        if: ${{always()}}
        run: ccache -s || true

      - name: Test Cactus
        # We cannot run on accelerators. Single precision output is not accurate enough. Debug builds run too slowly.
        if: ${{matrix.accelerator == 'cpu' && matrix.real-precision == 'real64' && matrix.mode == 'optimize'}}
        run: /bin/bash $GITHUB_WORKSPACE/scripts/test.sh

      - name: Verify 2D plane output
        # Same gating as the testsuite: plane values are checked analytically
        # against the TestPlanesX parfiles (Silo + openPMD).
        if: ${{matrix.accelerator == 'cpu' && matrix.real-precision == 'real64' && matrix.mode == 'optimize'}}
        run: /bin/bash $GITHUB_WORKSPACE/scripts/test-planes.sh
        env:
          CACTUS_DIR: ${{github.workspace}}/../workspace/Cactus

      - name: Locate plane output
        # upload-artifact@v4 rejects '..' in paths; resolve it first.
        if: ${{matrix.accelerator == 'cpu' && matrix.real-precision == 'real64' && matrix.mode == 'optimize'}}
        run: echo "PLANES_DIR=$(realpath "$GITHUB_WORKSPACE/../workspace/Cactus/test-planes-run")" >> "$GITHUB_ENV"

      - name: Upload plane output (for offline VisIt checks)
        # The numeric verification never opens the files with VisIt; keep the
        # raw plane output around so reader/VisIt compatibility can be checked
        # offline against the exact bytes CI produced.
        if: ${{matrix.accelerator == 'cpu' && matrix.real-precision == 'real64' && matrix.mode == 'optimize'}}
        uses: actions/upload-artifact@v4
        with:
          name: plane-output
          path: ${{env.PLANES_DIR}}
          retention-days: 7

      - name: Cache VisIt
        # The numeric verifier reads leaf files directly and never opens the
        # metafile/multimesh the way VisIt does; three metafile-class bugs
        # (mrgtree empty-child-map crash, 3D mrgTree name mismatch,
        # interior-mode unreadable leaf files) were invisible to it. Gate CI
        # on driving an actual headless VisIt over every produced database.
        if: ${{matrix.accelerator == 'cpu' && matrix.real-precision == 'real64' && matrix.mode == 'optimize' && env.RUN_VISIT == 'true'}}
        uses: actions/cache@v4
        with:
          path: visit3_4_2.linux-x86_64-debian12.tar.gz
          key: visit-3.4.2-debian12

      - name: Install VisIt
        if: ${{matrix.accelerator == 'cpu' && matrix.real-precision == 'real64' && matrix.mode == 'optimize' && env.RUN_VISIT == 'true'}}
        run: |
          # VisIt bundles Qt6/ICU/HDF5 itself, but its viewer needs the
          # system X11/fontconfig/GL/dbus layer, which the carpetx container
          # lacks (the viewer otherwise dies with "libfontconfig.so.1: cannot
          # open shared object file" and the CLI waits forever).
          # Per-package with || so one bad name / repo hiccup cannot kill the
          # step; the ldd scan and the smoke test below are the real gates
          # and print exactly what is still missing. (libglib2.0-0t64 vs
          # libglib2.0-0: the 64-bit time_t package rename.)
          apt-get update -qq || echo "::warning::apt-get update failed"
          for p in libfontconfig1 libfreetype6 libharfbuzz0b libdbus-1-3 \
                   libgl1 libegl1 libopengl0 libglx0 \
                   libx11-6 libxext6 libxrender1 libxkbcommon0 libsm6 libice6 \
                   libxcursor1 libxfixes3 \
                   libdouble-conversion3 libmd4c0 libb2-1 libbrotli1 \
                   libglib2.0-0t64 libglib2.0-0; do
            apt-get install -y -qq --no-install-recommends "$p" \
              || echo "::warning::could not install $p"
          done
          if [ ! -f visit3_4_2.linux-x86_64-debian12.tar.gz ]; then
            wget -nv https://github.com/visit-dav/visit/releases/download/v3.4.2/visit3_4_2.linux-x86_64-debian12.tar.gz
          fi
          tar xzf visit3_4_2.linux-x86_64-debian12.tar.gz -C /opt
          /opt/visit3_4_2.linux-x86_64/bin/visit -version
          # Diagnostic only: list libraries that are still unresolvable. The
          # launcher provides VisIt's bundled libs via LD_LIBRARY_PATH (no
          # rpath), so resolve against the install's lib dir; anything still
          # "not found" is a missing SYSTEM library. The smoke test below is
          # the gate -- it exercises the real cli+viewer startup.
          vdir=/opt/visit3_4_2.linux-x86_64/3.4.2/linux-x86_64
          for b in viewer cli mdserver engine_ser; do
            LD_LIBRARY_PATH="$vdir/lib:$vdir/lib/mesagl" ldd "$vdir/bin/$b" 2>/dev/null \
              | grep "not found" | sed "s/^/::warning::$b: /" || true
          done
          echo 'print("visit cli+viewer smoke OK"); import sys; sys.exit(0)' > /tmp/visit-smoke.py
          timeout 300 /opt/visit3_4_2.linux-x86_64/bin/visit -nowin -cli \
            -s /tmp/visit-smoke.py 2>&1 | tee visit-smoke.log || true
          grep -q "visit cli+viewer smoke OK" visit-smoke.log

      - name: Check plane output with VisIt
        # visit-check-planes.py opens every Silo metafile (multimesh + AMR
        # mrgtree), every leaf .silo file, and every openPMD .h5 plane file,
        # plots them, and queries the actual plotted data (an all-white draw
        # fails). VisIt's CLI launcher mangles the script's exit code
        # (observed 250 on success), so gate on the printed summary line.
        # timeout: a wedged viewer (e.g. missing system libs) must fail the
        # step quickly instead of pinning the job until the workflow timeout.
        if: ${{matrix.accelerator == 'cpu' && matrix.real-precision == 'real64' && matrix.mode == 'optimize' && env.RUN_VISIT == 'true'}}
        run: |
          timeout 1800 /opt/visit3_4_2.linux-x86_64/bin/visit -nowin -cli \
            -s "$GITHUB_WORKSPACE/scripts/visit-check-planes.py" \
            "$PLANES_DIR" "$GITHUB_WORKSPACE/plane-renders" \
            2>&1 | tee visit-check.log || true
          grep -E 'checked [1-9][0-9]* databases, 0 failure\(s\)' visit-check.log

      - name: Upload VisIt renders
        if: ${{always() && matrix.accelerator == 'cpu' && matrix.real-precision == 'real64' && matrix.mode == 'optimize' && env.RUN_VISIT == 'true'}}
        uses: actions/upload-artifact@v4
        with:
          name: plane-renders
          path: plane-renders
          retention-days: 7
          if-no-files-found: ignore
